name: Bot Riset Koin (Telegram)

# JALUR UTAMA: repository_dispatch.
# Telegram -> Cloudflare Worker -> POST /dispatches -> workflow ini jalan SEKARANG.
# Pesannya ikut dikirim lewat client_payload, jadi tidak perlu polling sama sekali.
#
# Cron SENGAJA TIDAK DIPAKAI: GitHub tidak menjamin jadwal — "*/5" kenyataannya
# berjalan ~1 jam sekali, kadang lebih dari 3 jam, sehingga balasan terasa hilang.
#
# workflow_dispatch disimpan sebagai CADANGAN manual (mode polling). Catatan: selama
# webhook Telegram aktif, getUpdates dinonaktifkan Telegram — jalankan
# deploy/set-webhook.sh --delete dulu kalau mau memakai mode polling.

on:
  repository_dispatch:
    types: [telegram]
  workflow_dispatch: {}

# Satu pesan diproses satu per satu. Pesan berikutnya mengantre, tidak dibatalkan.
concurrency:
  group: telegram-analisa-bot
  cancel-in-progress: false

# Perlu menulis: ingatan terverifikasi (cloud/data/memori.jsonl) di-commit balik ke repo.
# kalender_cache.json juga ikut: runner GitHub selalu bersih, jadi cache yang tidak
# di-commit tidak pernah terpakai di run berikutnya — padahal Forex Factory hanya
# mengizinkan 2 unduhan per 5 menit dan bot ini bisa jalan puluhan kali per jam.
# supaya bertahan antar-run. Tiap run adalah mesin baru, jadi tanpa ini bot tidak ingat
# apa pun. Concurrency di atas membuat run berurutan, sehingga tidak saling tabrakan.
permissions:
  contents: write

jobs:
  bot:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Kunci API diwariskan ke server MCP lewat environment job ini.
      # SENGAJA tidak ditulis sebagai "${...}" di .mcp.cloud.json: kalau variabelnya
      # tidak di-set, Claude Code meneruskan teks harfiah "${NAMA}" sebagai nilai,
      # dan server MCP menganggapnya kunci sungguhan lalu gagal dengan error auth
      # yang membingungkan. Pewarisan environment tidak punya masalah itu.
      # Jalur berkas hasil pembaca Telegram. BUKAN rahasia — hanya lokasi.
      # TELEGRAM_SESSION SENGAJA TIDAK ADA di sini: ia hanya boleh berada di step
      # pembaca, bukan di step yang menjalankan model.
      BERKAS_TELEGRAM: ${{ runner.temp }}/telegram.txt
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      COINGLASS_API_KEY: ${{ secrets.COINGLASS_API_KEY }}
      COINMARKETCAP_API_KEY: ${{ secrets.COINMARKETCAP_API_KEY }}
      COINALYZE_API_KEY: ${{ secrets.COINALYZE_API_KEY }}
      # Untuk holder/wallet multi-chain (BSC, Base, Arbitrum, Solana, dll) via cloud/
      # investors.py & wallet.py. GRATIS — daftar di moralis.com. Kalau kosong, chain
      # Ethereum tetap jalan (pakai Ethplorer); chain lain akan memberi pesan jelas.
      MORALIS_API_KEY: ${{ secrets.MORALIS_API_KEY }}
      # Opsional. Kosong = jadwal earnings, kejutan EPS, dan daftar peer dilaporkan
      # tidak tersedia; analisa saham TETAP jalan dari market.py, stockfund.py, dan
      # konteks.py — pola yang sama dengan dua kunci opsional di atas.
      FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
      # Opsional. Arus dana ETF spot berubah TIAP HARI, jadi tidak bisa disimpan sebagai
      # berkas seperti riwayat konsensus yang bulanan — harus ditarik saat analisa. Kosong
      # = bagian arus ETF dilaporkan tidak tersedia dan analisa crypto tetap jalan.
      SOSOVALUE_API_KEY: ${{ secrets.SOSOVALUE_API_KEY }}
      SUBSCRIPTION_LEVEL: Basic
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      # Isi hanya saat dipicu webhook; kosong saat dijalankan manual.
      TG_CHAT_ID: ${{ github.event.client_payload.chat_id }}
      TG_TEXT: ${{ github.event.client_payload.text }}
      TG_PHOTO_FILE_ID: ${{ github.event.client_payload.photo_file_id }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # WAJIB ref: main. Secara bawaan checkout mengambil commit SAAT EVENT DIBUAT,
          # bukan commit terbaru. Untuk dispatch ganda (dua event dibuat pada detik yang
          # sama) itu fatal: run kedua sudah mengantre dengan benar, tapi tetap checkout
          # versi repo SEBELUM run pertama menyimpan jejak pesan — sehingga pencegah
          # duplikat tidak pernah melihat catatannya. Terbukti pada run 30918498339 &
          # 30918500749: keduanya membalas pesan yang sama.
          ref: main

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Hanya untuk jalur manual: cek dulu ada pesan menunggu atau tidak, supaya
      # run kosong berhenti murah tanpa memasang apa pun.
      - name: Cek pesan menunggu (mode manual)
        id: check
        if: github.event_name == 'workflow_dispatch'
        run: python cloud/bot_oneshot.py --check

      # PENGINTIP. Menentukan apakah pembaca Telegram perlu jalan, SEBELUM step yang
      # memegang session dimulai. Tidak ada kredensial di sini sama sekali — hanya teks
      # pesan yang sudah dikirim Worker lewat client_payload.
      - name: Cek apakah minta riset Telegram
        id: tg
        env:
          TG_TEXT: ${{ github.event.client_payload.text }}
        run: |
          if python cloud/bot_oneshot.py --minta-telegram; then
            echo "perlu=ya" >> "$GITHUB_OUTPUT"
            echo "user meminta riset grup Telegram"
          else
            echo "perlu=tidak" >> "$GITHUB_OUTPUT"
          fi

      # PEMBACA. SATU-SATUNYA step yang memegang TELEGRAM_SESSION — dan sengaja tidak
      # menjalankan model, tidak memanggil MCP, tidak menyentuh jaringan selain Telegram.
      # Session memberi akses penuh ke akun; menaruhnya di step yang menjalankan LLM
      # berarti injeksi prompt dari isi grup berada di lingkungan yang sama dengan
      # kredensialnya. Di sini tidak ada yang bisa dijangkau injeksi.
      - name: Baca grup Telegram
        if: steps.tg.outputs.perlu == 'ya'
        continue-on-error: true
        env:
          TELEGRAM_SESSION: ${{ secrets.TELEGRAM_SESSION }}
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
        run: |
          pip install --quiet telethon
          python cloud/tgbaca.py --jam 24 > "$RUNNER_TEMP/telegram.txt"
          echo "terkumpul $(wc -c < "$RUNNER_TEMP/telegram.txt") karakter"

      - name: Setup Node
        if: github.event_name == 'repository_dispatch' || steps.check.outputs.has_work == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # Sengaja install global, bukan "npx -y" di dalam konfigurasi MCP: npx mengunduh
      # ulang tiap run (lambat) dan pernah gagal karena cache terkunci. Binary global
      # membuat perintahnya deterministik.
      - name: Install Claude Code CLI & MCP server (Node)
        if: github.event_name == 'repository_dispatch' || steps.check.outputs.has_work == 'true'
        run: npm install -g @anthropic-ai/claude-code mcp-coinglass @shinzolabs/coinmarketcap-mcp

      - name: Install TradingView MCP (versi data)
        if: github.event_name == 'repository_dispatch' || steps.check.outputs.has_work == 'true'
        run: pip install tradingview-mcp-server

      - name: Jalankan analisa & balas ke Telegram
        id: jalankan
        if: github.event_name == 'repository_dispatch' || steps.check.outputs.has_work == 'true'
        run: python cloud/bot_oneshot.py

      # JARING PENGAMAN. Kalau langkah di atas gagal ATAU dibunuh dari luar (runner
      # direbut, job dibatalkan, kehabisan waktu), proses Python tidak sempat mengabari
      # siapa pun — user hanya melihat pesannya tenggelam tanpa jejak. Terjadi nyata pada
      # run 31118489351 (6 Agustus 2026): job berjalan 15 menit lalu cancelled, dan TIDAK
      # ADA balasan sama sekali. Langkah ini memanggil Telegram langsung lewat curl,
      # sehingga tidak bergantung pada proses Python yang sudah mati.
      - name: Kabari kalau gagal
        if: always() && steps.jalankan.outcome != 'success' && steps.jalankan.outcome != 'skipped'
        env:
          TG: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CH: ${{ github.event.client_payload.chat_id }}
        run: |
          if [ -z "$TG" ] || [ -z "$CH" ]; then
            echo "token/chat id kosong — lewati pemberitahuan"
            exit 0
          fi
          PESAN="⚠️ Maaf, pemrosesan pesanmu terhenti di tengah jalan (${{ steps.jalankan.outcome }}) jadi tidak ada hasil yang bisa dikirim.
          Silakan kirim ulang perintahnya. Kalau ini analisa berat, coba persempit (mis. sebut satu koin saja)."
          curl -s -o /dev/null -X POST "https://api.telegram.org/bot$TG/sendMessage" \
            --data-urlencode "chat_id=$CH" --data-urlencode "text=$PESAN" || true
          echo "pemberitahuan kegagalan dikirim ke user"

      # Simpan ingatan terverifikasi + jejak pesan (pencegah dispatch ganda).
      # Jejak WAJIB ikut ter-commit: run berikutnya membacanya saat checkout untuk
      # mengenali pesan yang sudah diproses. Sengaja `always()`: balasan sudah dikirim ke user,
      # jadi fakta yang sempat diverifikasi tetap layak disimpan walau langkah di atas
      # berakhir tidak mulus. Hanya file memori yang di-commit — tidak menyentuh kode.
      - name: Simpan ingatan terverifikasi
        if: always() && (github.event_name == 'repository_dispatch' || steps.check.outputs.has_work == 'true')
        run: |
          if [ -z "$(git status --porcelain cloud/data/memori.jsonl cloud/data/diproses.json cloud/data/percakapan.json cloud/data/kalender_cache.json cloud/data/rapor.jsonl cloud/data/sec_tickers_cache.json.gz cloud/data/kejutan_cache.json cloud/data/jadwal_cache.json cloud/data/arsip_konsensus.jsonl cloud/data/sosovalue_riwayat.json cloud/data/derivatif_arsip.jsonl)" ]; then
            echo "tidak ada ingatan baru — lewati commit"
            exit 0
          fi
          git config user.name "crypto-analis-bot"
          git config user.email "bot@users.noreply.github.com"
          git add cloud/data/memori.jsonl cloud/data/diproses.json cloud/data/percakapan.json cloud/data/kalender_cache.json cloud/data/rapor.jsonl cloud/data/sec_tickers_cache.json.gz cloud/data/kejutan_cache.json cloud/data/jadwal_cache.json cloud/data/arsip_konsensus.jsonl cloud/data/sosovalue_riwayat.json cloud/data/derivatif_arsip.jsonl
          git commit -m "Ingatan, jejak pesan & riwayat percakapan dari run ${GITHUB_RUN_ID}"
          # Run lain bisa menambah commit lebih dulu; rebase supaya tidak saling menimpa.
          for i in 1 2 3; do
            git pull --rebase --autostash origin main && git push origin HEAD:main && exit 0
            echo "percobaan $i gagal, ulangi..."
            sleep 3
          done
          echo "::warning::Ingatan gagal disimpan setelah 3 percobaan (balasan tetap terkirim)."
