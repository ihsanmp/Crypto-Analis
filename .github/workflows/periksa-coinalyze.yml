# Pemeriksaan sekali jalan: endpoint Coinalyze mana yang SUNGGUH terbuka untuk kunci kita.
# Dokumentasinya menulis "The API is free", tapi "gratis" belum tentu "terbuka untuk kunci
# ini" — CoinMarketCap sudah mengajarkan itu, endpoint yang tertulis tersedia ternyata
# membalas 403 tergantung paket. Menebaknya berarti membangun di atas endpoint yang tertutup.
#
# Tiga yang harus terjawab: apakah /liquidation-history terbuka, seberapa jauh ke belakang
# riwayat HARIAN benar-benar ada, dan apakah /open-interest-history bisa menggantikan arsip
# harian yang ditumbuhkan derivatif.py.
#
# Kenapa lewat workflow, bukan dijalankan lokal: kuncinya HANYA ada di GitHub Secrets, dan
# memang harus tetap begitu.
#
# Hanya workflow_dispatch — ini pertanyaan sekali jawab, bukan tugas berkala. Jalankan lagi
# kalau paketnya berubah atau ada endpoint yang tiba-tiba menolak.
#
# CATATAN KEAMANAN: repo ini publik, jadi log Actions ikut terbaca publik. cloud/cmc.py tidak
# pernah mencetak kuncinya dan GitHub menyamarkan nilai secret yang terdaftar. Jangan
# menambahkan `echo` apa pun terhadap kunci di sini.
name: Periksa akses Coinalyze

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  periksa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Tembak tiap endpoint kandidat
        env:
          COINALYZE_API_KEY: ${{ secrets.COINALYZE_API_KEY }}
        run: |
          if [ -z "$COINALYZE_API_KEY" ]; then
            echo "::error::COINALYZE_API_KEY belum terpasang di repository secrets"
            exit 1
          fi
          python cloud/coinalyze.py --periksa
          echo "---- keluaran nyata untuk BTC ----"
          python cloud/coinalyze.py BTC
