# Penyegaran data SoSoValue. Awalnya alat pemeriksaan sekali jalan untuk menemukan alamat
# endpoint yang benar; setelah semuanya ketahuan, tugasnya berubah jadi PENYEGAR BERKALA.
#
# Kenapa harus lewat workflow, bukan dijalankan saat analisa: kuncinya hanya ada di GitHub
# Secrets. Riwayat konsensus disimpan sebagai berkas supaya kejutan.py bisa memakainya TANPA
# kunci — datanya cuma berubah saat ada rilis baru, jadi menariknya tiap analisa itu
# pemborosan sekaligus risiko kena batas laju.
#
# Mingguan sudah cukup: NFP terbit sebulan sekali, CPI dan PPI juga. Jadwal Minggu 05:00 UTC
# = 12:00 WIB. Data ETF harian ikut ditarik di sini hanya sebagai cadangan — jalur analisa
# memanggilnya langsung karena arusnya berubah tiap hari.
#
# Catatan: GitHub menonaktifkan workflow terjadwal setelah 60 hari repo tidak aktif, dan
# waktu mulainya bisa meleset beberapa menit saat antrean padat. Keduanya tidak masalah di
# sini karena datanya bulanan.
#
# CATATAN KEAMANAN: repo ini publik, jadi log Actions ikut terbaca publik. cloud/sosovalue.py
# tidak pernah mencetak kuncinya, dan GitHub menyamarkan nilai secret yang terdaftar. Jangan
# menambahkan `echo` apa pun terhadap kunci di sini.
name: Segarkan data SoSoValue

on:
  schedule:
    - cron: "0 5 * * 0"       # Minggu 05:00 UTC = 12:00 WIB
  workflow_dispatch:

permissions:
  contents: write

jobs:
  periksa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Jalankan pemeriksaan
        env:
          SOSOVALUE_API_KEY: ${{ secrets.SOSOVALUE_API_KEY }}
        run: |
          if [ -z "$SOSOVALUE_API_KEY" ]; then
            echo "::error::SOSOVALUE_API_KEY belum terpasang di repository secrets"
            exit 1
          fi
          # --periksa sengaja TIDAK ikut: penemuan endpoint sudah selesai, dan menjalankannya
          # tiap minggu berarti membuang belasan panggilan kuota untuk pertanyaan yang sudah
          # terjawab. Jalankan manual dengan --periksa kalau ada yang tiba-tiba 404.
          python cloud/sosovalue.py --tarik-riwayat --tarik-etf

      - name: Simpan riwayat & data ETF
        run: |
          if [ -z "$(git status --porcelain cloud/data/sosovalue_riwayat.json cloud/data/sosovalue_etf.json)" ]; then
            echo "data tidak berubah — lewati commit"
            exit 0
          fi
          git config user.name "crypto-analis-bot"
          git config user.email "bot@users.noreply.github.com"
          git add cloud/data/sosovalue_riwayat.json cloud/data/sosovalue_etf.json
          git commit -m "Segarkan riwayat konsensus & data ETF SoSoValue dari run ${GITHUB_RUN_ID}"
          for i in 1 2 3; do
            git pull --rebase --autostash origin main && git push origin HEAD:main && exit 0
            sleep 3
          done
          echo "::warning::data ETF gagal disimpan setelah 3 percobaan"
