# Uji "konsep elevator" mentor #2 (rotasi pemimpin -> koin berikutnya) pada harga harian
# CoinGecko 365 hari. ~90 permintaan — butuh COINGECKO_DEMO_KEY, jadi berjalan di sini.
# Hanya data harga publik.
name: Uji rotasi narasi

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  uji:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Uji rotasi
        env:
          COINGECKO_DEMO_KEY: ${{ secrets.COINGECKO_DEMO_KEY }}
        run: python cloud/uji_rotasi.py
