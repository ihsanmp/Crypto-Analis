# Diagnostik manual: sumber data mana yang GAGAL / KOSONG / sebagian hilang DI RUNNER, untuk
# beberapa koin & aset pasar sekaligus. Tidak memanggil Claude, tidak mengirim ke Telegram,
# tidak meng-commit apa pun. Yang dicetak hanya judul blok, status, dan potongan galat yang
# sudah dibersihkan (repo publik -> log publik).
name: Periksa sumber data

on:
  workflow_dispatch:
    inputs:
      argumen:
        description: "kosong = daftar bawaan; contoh: BTC AAVE --pasar NVDA:saham GC=F:forex"
        default: ""

permissions:
  contents: read

jobs:
  periksa:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      COINMARKETCAP_API_KEY: ${{ secrets.COINMARKETCAP_API_KEY }}
      COINGECKO_DEMO_KEY: ${{ secrets.COINGECKO_DEMO_KEY }}
      COINALYZE_API_KEY: ${{ secrets.COINALYZE_API_KEY }}
      MORALIS_API_KEY: ${{ secrets.MORALIS_API_KEY }}
      FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
      SEC_CONTACT: ${{ secrets.SEC_CONTACT }}
      GMGN_API_KEY: ${{ secrets.GMGN_API_KEY }}
      ETHERSCAN_API_KEY: ${{ secrets.ETHERSCAN_API_KEY }}
      SOLSCAN_API_KEY: ${{ secrets.SOLSCAN_API_KEY }}
      SOSOVALUE_API_KEY: ${{ secrets.SOSOVALUE_API_KEY }}
      FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
      SUBSCRIPTION_LEVEL: Basic
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Kumpulkan & rekap
        env:
          ARGUMEN: ${{ inputs.argumen }}
        run: python cloud/periksa_sumber.py $ARGUMEN
