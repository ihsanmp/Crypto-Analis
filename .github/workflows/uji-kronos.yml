# Uji sekali jalan: apakah Kronos (model fondasi candlestick, MIT) MENGUNGGULI metode
# prediksi_harga bot. Kriteria dikunci di docstring cloud/uji_kronos.py sebelum dijalankan.
#
# Terpisah dari jalur produksi: torch CPU + bobot model hanya dipasang di sini. Tidak
# memanggil Claude, tidak mengirim ke Telegram, tidak meng-commit apa pun — hasil gabungan
# diunggah sebagai artefak.
#
#   mode=probe : ukur WAKTU per titik asal saja (tanpa akurasi), untuk memilih langkah.
#   mode=uji   : 3 aset x 8 segmen paralel (24 job), lalu gabung & vonis.
name: Uji Kronos vs metode bot

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "probe | uji | ulang"
        default: "probe"
      ulang:
        description: 'mode ulang: JSON daftar "ASET|JALAN|segmen", mis. ["ETH|H24|utama:2025-09-01:2025-11-10:2"]'
        default: "[]"

permissions:
  contents: read

env:
  KRONOS_COMMIT: 67b630e67f6a18c9e9be918d9b4337c960db1e9a
  KRONOS_SRC: kronos_src

jobs:
  probe:
    if: inputs.mode == 'probe'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      matrix:
        jalan: [H24, D]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Pasang Kronos (commit terkunci) + torch CPU
        run: |
          git clone --quiet https://github.com/shiyu-coder/Kronos.git "$KRONOS_SRC"
          git -C "$KRONOS_SRC" checkout --quiet "$KRONOS_COMMIT"
          pip install --quiet torch --index-url https://download.pytorch.org/whl/cpu
          pip install --quiet einops==0.8.1 huggingface_hub==0.33.1 safetensors==0.6.2 pandas numpy tqdm
          nproc
      - run: python cloud/uji_kronos.py --probe --aset BTC --jalan ${{ matrix.jalan }}

  uji:
    if: inputs.mode == 'uji'
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        aset: [BTC, ETH, SOL]
        # jalan|segmen — jarak titik asal dipilih dari probe WAKTU (lihat addendum docstring)
        seg:
          - "H24|utama:2025-09-01:2026-01-20:2"
          - "H24|utama:2026-01-21:2026-06-11:2"
          - "H24|utama:2026-06-12:2026-10-31:2"
          - "H24|kedua:2024-07-01:2025-08-31:7"
          - "D|utama:2025-09-01:2026-01-20:1"
          - "D|utama:2026-01-21:2026-06-11:1"
          - "D|utama:2026-06-12:2026-10-31:1"
          - "D|kedua:2024-07-01:2025-08-31:7"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Pasang Kronos (commit terkunci) + torch CPU
        run: |
          git clone --quiet https://github.com/shiyu-coder/Kronos.git "$KRONOS_SRC"
          git -C "$KRONOS_SRC" checkout --quiet "$KRONOS_COMMIT"
          pip install --quiet torch --index-url https://download.pytorch.org/whl/cpu
          pip install --quiet einops==0.8.1 huggingface_hub==0.33.1 safetensors==0.6.2 pandas numpy tqdm
      - name: Ramal walk-forward
        env:
          SEG: ${{ matrix.seg }}
        run: python cloud/uji_kronos.py --aset ${{ matrix.aset }} --jalan "${SEG%%|*}" --segmen "${SEG#*|}"
      - id: nama
        env:
          SEG: ${{ matrix.seg }}
        run: echo "nama=$(echo "$SEG" | tr '|:' '__')" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7
        with:
          name: kronos-${{ matrix.aset }}-${{ steps.nama.outputs.nama }}
          path: hasil_*.json
          retention-days: 14

  ulang:
    if: inputs.mode == 'ulang'
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        item: ${{ fromJSON(inputs.ulang) }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Pasang Kronos (commit terkunci) + torch CPU
        run: |
          git clone --quiet https://github.com/shiyu-coder/Kronos.git "$KRONOS_SRC"
          git -C "$KRONOS_SRC" checkout --quiet "$KRONOS_COMMIT"
          pip install --quiet torch --index-url https://download.pytorch.org/whl/cpu
          pip install --quiet einops==0.8.1 huggingface_hub==0.33.1 safetensors==0.6.2 pandas numpy tqdm
      - name: Ramal walk-forward
        timeout-minutes: 330
        env:
          ITEM: ${{ matrix.item }}
        run: |
          IFS='|' read -r ASET JALAN SEG <<< "$ITEM"
          python cloud/uji_kronos.py --aset "$ASET" --jalan "$JALAN" --segmen "$SEG"
      - id: nama
        if: always()
        env:
          ITEM: ${{ matrix.item }}
        run: echo "nama=$(echo "$ITEM" | tr '|:' '__')" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: kronos-${{ steps.nama.outputs.nama }}
          path: hasil_*.json
          if-no-files-found: warn
          retention-days: 14

  gabung:
    needs: uji
    if: always() && inputs.mode == 'uji'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - uses: actions/download-artifact@v7
        with:
          path: semua
      - run: python cloud/uji_kronos.py --gabung semua
      - uses: actions/upload-artifact@v7
        with:
          name: kronos-vonis
          path: cloud/data/uji_kronos.json
          retention-days: 30
